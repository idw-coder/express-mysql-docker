services:
  mysql:
    image: mysql:8.4.0
    container_name: mysql
    restart: always
    env_file:
      - ./db/.env
    volumes:
      - mysql_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  nextjs:
    image: ghcr.io/idw-coder/next-basic:latest
    container_name: nextjs
    ports:
      - '3000:3000'
    env_file:
      - ./nextjs/.env
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=myapp
      - DB_CONNECTION_LIMIT=10
    restart: unless-stopped

volumes:
  mysql_data:
